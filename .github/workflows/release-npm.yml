name: OpenClaw plugin release (npm)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the package without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: openclaw-npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:install
      - run: npm publish --access public --dry-run
      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
